{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Django App{% endblock %}</title>

    <!-- Bootstrap 5 CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous">

    <!-- Project variables and optional main stylesheet -->
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">

    <!-- Calculator custom styles (overrides on top of Bootstrap) -->
    <link rel="stylesheet" href="{% static 'css/calculator.css' %}">

    {% block head_extra %}{% endblock %}
</head>
<body>
    <div class="site-wrapper">
        <header class="site-header py-3 shadow-sm">
            <div class="container d-flex align-items-center justify-content-between">
                <a href="/" class="brand h4 mb-0 text-decoration-none">My Django Form</a>
                <nav class="nav">
                    <a href="/" class="nav-link d-inline-block">Form</a>
                    <a href="/success/" class="nav-link d-inline-block">Success</a>
                </nav>
            </div>
        </header>

        <main class="container main-content my-5" role="main">
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer py-4 bg-light" role="contentinfo">
            <div class="container footer-inner text-center">
                <p class="mb-0">&copy; {{ now|date:"Y" }} My Django Form. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <!-- Bootstrap JS (Bundle with Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-VkUQ5Y3o2Qm6mXQeQbP3E3c5p6Z6I6b6q0v5Z8K9h5Y3vE1mZ6gF8yT9QkC0d1Rr" crossorigin="anonymous"></script>

    {% block extra_js %}
    <script src="{% static 'js/main.js' %}"></script>
    <script src="{% static 'js/calculator.js' %}"></script>
    {% endblock %}
</body>
</html>
