{% extends "base.html" %}
{% load static %}

{% block title %}User Form{% endblock %}

{% block content %}
<h1 class="page-title">User Form</h1>

<form method="POST" class="form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <!-- Removed inline styles: none (converted to class-based layout) -->
    <div class="form-actions">
        <button type="submit" class="btn btn--primary">Submit</button>
    </div>
</form>
{% endblock %}
